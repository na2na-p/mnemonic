# golangci-lint v2 設定
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
  exclusions:
    rules:
      # テストコードではハードコードされたパスや弱い乱数を許容する
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/na2na-p/mnemonic
